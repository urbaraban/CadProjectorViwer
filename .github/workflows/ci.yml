name: CI

on:
  push:
    branches: [rewrite/2cut, main, master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      # Full 2Cut.sln needs sibling VLTLaserController.net; core tests do not.
      - name: Test core libraries
        run: dotnet test tests/CadProjector.Tests/CadProjector.Tests.csproj -c Release --verbosity normal
